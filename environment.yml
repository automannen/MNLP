name: mnlp

channels:
  - pytorch
  - nvidia
  - conda-forge

dependencies:
  - python=3.12.7
  - pip=24.2.0

  - pytorch=2.5.0
  - pytorch-cuda=11.8

  - pip:
      - transformers==4.46.3
      - accelerate==1.0.1
      - datasets==3.1.0
      - sentencepiece==0.2.0
      - protobuf>=4.25.3,<6
      - sacrebleu==2.4.3
      - pyyaml==6.0.2
      - unbabel-comet==2.2.7
      # Language identification of the outputs (identify_languages.py).
      - fasttext-wheel==0.9.2
      # conda's pytorch=2.5.0 fails to import without these MKL libraries.
      - mkl==2024.0
      # torchmetrics (used by COMET) still imports pkg_resources.
      - setuptools<81