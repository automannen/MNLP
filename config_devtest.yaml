# Final-evaluation configuration: same pipeline as config.yaml, but on the held-out
# "devtest" split and with the script-contrast languages added. config.yaml stays on
# "dev" (exploration), so the 54B and efficiency scripts are unaffected.
# Use with: python run_evaluation.py --config config_devtest.yaml --outputs_dir outputs_devtest ...

dataset:
  name: openlanguagedata/flores_plus
  split: devtest
  # Local cache dir the dataset is downloaded to once and re-used from afterwards
  # (Snellius compute nodes have no internet access).
  data_dir: data/flores

# Human-readable name -> FLORES language+script code.
languages:
  en: eng_Latn
  sw: swh_Latn
  ru: rus_Cyrl
  ba: bak_Cyrl
  zh: cmn_Hant
  yue: yue_Hant
  ar: arb_Arab
  ace: ace_Arab
  # Script-contrast additions (same language, different script).
  ace_latn: ace_Latn
  bjn_arab: bjn_Arab
  bjn_latn: bjn_Latn
  kas_arab: kas_Arab
  kas_deva: kas_Deva
  taq_latn: taq_Latn
  taq_tfng: taq_Tfng

# Translation directions to build/evaluate, as [src_lang, tgt_lang] FLORES codes.
directions:
  # All 56 directions between the 8 original languages.
  # - [eng_Latn, swh_Latn]
  # - [eng_Latn, rus_Cyrl]
  # - [eng_Latn, bak_Cyrl]
  # - [eng_Latn, cmn_Hant]
  # - [eng_Latn, yue_Hant]
  # - [eng_Latn, arb_Arab]
  # - [eng_Latn, ace_Arab]
  # - [swh_Latn, eng_Latn]
  # - [swh_Latn, rus_Cyrl]
  # - [swh_Latn, bak_Cyrl]
  # - [swh_Latn, cmn_Hant]
  # - [swh_Latn, yue_Hant]
  # - [swh_Latn, arb_Arab]
  # - [swh_Latn, ace_Arab]
  # - [rus_Cyrl, eng_Latn]
  # - [rus_Cyrl, swh_Latn]
  # - [rus_Cyrl, bak_Cyrl]
  # - [rus_Cyrl, cmn_Hant]
  # - [rus_Cyrl, yue_Hant]
  # - [rus_Cyrl, arb_Arab]
  # - [rus_Cyrl, ace_Arab]
  # - [bak_Cyrl, eng_Latn]
  # - [bak_Cyrl, swh_Latn]
  # - [bak_Cyrl, rus_Cyrl]
  # - [bak_Cyrl, cmn_Hant]
  # - [bak_Cyrl, yue_Hant]
  # - [bak_Cyrl, arb_Arab]
  # - [bak_Cyrl, ace_Arab]
  # - [cmn_Hant, eng_Latn]
  # - [cmn_Hant, swh_Latn]
  # - [cmn_Hant, rus_Cyrl]
  # - [cmn_Hant, bak_Cyrl]
  # - [cmn_Hant, yue_Hant]
  # - [cmn_Hant, arb_Arab]
  # - [cmn_Hant, ace_Arab]
  # - [yue_Hant, eng_Latn]
  # - [yue_Hant, swh_Latn]
  # - [yue_Hant, rus_Cyrl]
  # - [yue_Hant, bak_Cyrl]
  # - [yue_Hant, cmn_Hant]
  # - [yue_Hant, arb_Arab]
  # - [yue_Hant, ace_Arab]
  # - [arb_Arab, eng_Latn]
  # - [arb_Arab, swh_Latn]
  # - [arb_Arab, rus_Cyrl]
  # - [arb_Arab, bak_Cyrl]
  # - [arb_Arab, cmn_Hant]
  # - [arb_Arab, yue_Hant]
  # - [arb_Arab, ace_Arab]
  # - [ace_Arab, eng_Latn]
  # - [ace_Arab, swh_Latn]
  # - [ace_Arab, rus_Cyrl]
  # - [ace_Arab, bak_Cyrl]
  # - [ace_Arab, cmn_Hant]
  # - [ace_Arab, yue_Hant]
  # - [ace_Arab, arb_Arab]
  # Every other original language -> Latin-script Acehnese (compare with -> ace_Arab).
  # - [eng_Latn, ace_Latn]
  # - [swh_Latn, ace_Latn]
  # - [rus_Cyrl, ace_Latn]
  # - [bak_Cyrl, ace_Latn]
  # - [cmn_Hant, ace_Latn]
  # - [yue_Hant, ace_Latn]
  # - [arb_Arab, ace_Latn]
  # - [ace_Latn, eng_Latn]
  # Banjar, Kashmiri and Tamasheq in both scripts, to and from English only.
  # - [eng_Latn, bjn_Arab]
  # - [bjn_Arab, eng_Latn]
  # - [eng_Latn, bjn_Latn]
  # - [bjn_Latn, eng_Latn]
  # - [eng_Latn, kas_Arab]
  # - [kas_Arab, eng_Latn]
  # - [eng_Latn, kas_Deva]
  # - [kas_Deva, eng_Latn]
  # - [eng_Latn, taq_Latn]
  # - [taq_Latn, eng_Latn]
  # - [eng_Latn, taq_Tfng]
  # - [taq_Tfng, eng_Latn]
  - [ace_Arab, eng_Latn]

model:
  checkpoint: facebook/nllb-200-distilled-600M
  # language code mapping from Flores data set -> NLLB language code
  language_code_mapping:
    cmn_Hant: zho_Hant

dataloader:
  batch_size: 16
  max_length: 512

# Where standardized, validated per-direction data is written before modeling.
processed_dir: data/processed
