# Central experiment configuration.
# Keeping this in one place prevents team members from running different experiments.

dataset:
  name: openlanguagedata/flores_plus
  # "dev" is used for pipeline development/debugging; "devtest" is reserved for
  # final evaluation only, to avoid tuning the pipeline on the held-out set.
  split: dev
  # Local cache dir the dataset is downloaded to once and re-used from afterwards
  # (Snellius compute nodes have no internet access).
  data_dir: data/flores

# Human-readable name -> FLORES language+script code.
languages:
  en: eng_Latn
  sw: swh_Latn
  ru: rus_Cyrl
  ba: bak_Cyrl
  zh: cmn_Hant
  yue: yue_Hant
  ar: arb_Arab
  ace: ace_Arab

# Translation directions to build/evaluate, as [src_lang, tgt_lang] FLORES codes.
# Constrained to at most 6 directions to keep experiments manageable.
directions:
  - [eng_Latn, swh_Latn]
  - [swh_Latn, eng_Latn]
  - [eng_Latn, rus_Cyrl]
  - [rus_Cyrl, eng_Latn]
  - [swh_Latn, rus_Cyrl]
  - [rus_Cyrl, swh_Latn]
  - [eng_Latn, bak_Cyrl]
  - [eng_Latn, cmn_Hant]
  - [eng_Latn, yue_Hant]
  - [eng_Latn, arb_Arab]
  - [eng_Latn, ace_Arab]
  - [swh_Latn, bak_Cyrl]
  - [swh_Latn, cmn_Hant]
  - [swh_Latn, yue_Hant]
  - [swh_Latn, arb_Arab]
  - [swh_Latn, ace_Arab]
  - [rus_Cyrl, bak_Cyrl]
  - [rus_Cyrl, cmn_Hant]
  - [rus_Cyrl, yue_Hant]
  - [rus_Cyrl, arb_Arab]
  - [rus_Cyrl, ace_Arab]
  - [bak_Cyrl, eng_Latn]
  - [bak_Cyrl, swh_Latn]
  - [bak_Cyrl, rus_Cyrl]
  - [bak_Cyrl, cmn_Hant]
  - [bak_Cyrl, yue_Hant]
  - [bak_Cyrl, arb_Arab]
  - [bak_Cyrl, ace_Arab]
  - [cmn_Hant, eng_Latn]
  - [cmn_Hant, swh_Latn]
  - [cmn_Hant, rus_Cyrl]
  - [cmn_Hant, bak_Cyrl]
  - [cmn_Hant, yue_Hant]
  - [cmn_Hant, arb_Arab]
  - [cmn_Hant, ace_Arab]
  - [yue_Hant, eng_Latn]
  - [yue_Hant, swh_Latn]
  - [yue_Hant, rus_Cyrl]
  - [yue_Hant, bak_Cyrl]
  - [yue_Hant, cmn_Hant]
  - [yue_Hant, arb_Arab]
  - [yue_Hant, ace_Arab]
  - [arb_Arab, eng_Latn]
  - [arb_Arab, swh_Latn]
  - [arb_Arab, rus_Cyrl]
  - [arb_Arab, bak_Cyrl]
  - [arb_Arab, cmn_Hant]
  - [arb_Arab, yue_Hant]
  - [arb_Arab, ace_Arab]
  - [ace_Arab, eng_Latn]
  - [ace_Arab, swh_Latn]
  - [ace_Arab, rus_Cyrl]
  - [ace_Arab, bak_Cyrl]
  - [ace_Arab, cmn_Hant]
  - [ace_Arab, yue_Hant]
  - [ace_Arab, arb_Arab]

model:
  checkpoint: facebook/nllb-200-distilled-600M
  # language code mapping from Flores data set -> NLLB language code
  language_code_mapping:
    cmn_Hant: zho_Hant

dataloader:
  batch_size: 16
  max_length: 512

# Where standardized, validated per-direction data is written before modeling.
processed_dir: data/processed
